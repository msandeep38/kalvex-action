name: 'Kalvex Smart Contract Audit'
description: 'AI smart contract auditor. 150+ detectors, Foundry PoCs, DO NOT DEPLOY verdicts.'
author: 'msandeep38'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  api-key:
    description: 'Your Kalvex API key from kalvex.io/get-api-key'
    required: true
  contract-path:
    description: 'Path to the Solidity contract file to audit'
    required: true
  fail-on-critical:
    description: 'Fail the build if CRITICAL findings are found'
    required: false
    default: 'true'

outputs:
  verdict:
    description: 'Audit verdict: DO_NOT_DEPLOY, HIGH_RISK, REVIEW_REQUIRED, or SAFE_TO_DEPLOY'
  findings-count:
    description: 'Total number of findings'
  report-url:
    description: 'Shareable report URL'

runs:
  using: 'node20'
  main: 'dist/index.js'
